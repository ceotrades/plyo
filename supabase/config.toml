# Minimal config required by the Supabase CLI for function deployment.
# Local dev settings below are unused (you deploy directly to the hosted project).

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[functions.extract-workout]
verify_jwt = false

[functions.generate-calendar]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
